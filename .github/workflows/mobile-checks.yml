name: Mobile checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_PUBLIC_API_URL: https://ci-api.example.com
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_AUTH_MODE: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI generator unit test
        run: pnpm test:api-generator
      - name: Jest
        run: pnpm test --runInBand
      - name: TypeScript
        run: pnpm typecheck
      - name: Expo Doctor
        run: pnpm dlx expo-doctor
      - name: iOS Hermes export
        run: pnpm exec expo export --platform ios --output-dir /tmp/blackwave-ios-export
